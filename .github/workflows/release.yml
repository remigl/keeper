name: Release APK

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tests + release build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keeper.jks
            echo "SIGNING=permanent" >> "$GITHUB_ENV"
          else
            # No signing secrets yet: one-off key, so the APK is installable.
            KEYSTORE_PASSWORD=$(openssl rand -hex 16); KEY_PASSWORD=$KEYSTORE_PASSWORD; KEY_ALIAS=keeper
            keytool -genkeypair -keystore keeper.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Keeper"
            echo "SIGNING=temporary" >> "$GITHUB_ENV"
          fi
          OUT="keeper-${GITHUB_REF_NAME}.apk"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          KS_PASS="$KEYSTORE_PASSWORD" K_PASS="$KEY_PASSWORD" "$BT/apksigner" sign \
            --ks keeper.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:K_PASS \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          rm -f keeper.jks aligned.apk
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNING" = "temporary" ]; then
            NOTE="Signature temporaire (aucun secret de signature configuré) : une future version signée avec une autre clé ne pourra pas s'installer par-dessus, il faudra désinstaller d'abord."
          else
            NOTE="Signée avec la clé de publication du projet."
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes "$NOTE

          APK Android (8.1+). Aucune permission, aucun accès réseau."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Keeper $GITHUB_REF_NAME" \
            --notes "APK Android (8.1+). Aucune permission, aucun accès réseau. Installation : autoriser l'installation depuis la source, puis Paramètres → Accès aux notifications → Keeper (Android 13+ hors Play Store : Infos de l'application → ⋮ → Autoriser les paramètres restreints).

          $NOTE"
